<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Ingreso Personal (Médico / Sistema)</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card>
    <ion-card-header>
      <ion-card-title class="ion-text-center">Iniciar Sesión</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <form (ngSubmit)="onLogin()" #loginForm="ngForm">
        
        <ion-item>
          <ion-icon name="person-outline" slot="start"></ion-icon>
          <ion-input 
            label="Usuario" 
            label-placement="floating" 
            type="text" 
            name="usuario"
            [(ngModel)]="credenciales.usuario" 
            required>
          </ion-input>
        </ion-item>

        <ion-item class="ion-margin-top">
          <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
          <ion-input 
            label="Clave" 
            label-placement="floating" 
            type="password" 
            name="clave"
            [(ngModel)]="credenciales.clave" 
            required>
          </ion-input>
        </ion-item>

        <ion-button 
          expand="block" 
          color="success" 
          type="submit" 
          class="ion-margin-top"
          [disabled]="!loginForm.valid || isLoading">
          <ion-spinner *ngIf="isLoading" name="crescent"></ion-spinner>
          {{ isLoading ? 'Verificando...' : 'Ingresar' }}
        </ion-button>
      </form>

      <p *ngIf="error" class="ion-text-center ion-padding-top" style="color: red;">
        {{ error }}
      </p>
    </ion-card-content>
  </ion-card>
</ion-content>
